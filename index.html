<h1>Devbox backup</h1>
<p>A personal, single-user tool. Once a week it copies the owner's own password-encrypted computer backup into a folder in the owner's own Google Drive, and removes the previous week's copy.</p>
<p>It is not offered to anyone else. <a href="privacy.html">Privacy policy</a></p>
